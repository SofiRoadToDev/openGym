name: opengym

services:
  # Descarga una vez las imágenes/GIFs de ejercicios (~140 MB) a ./media.
  # Se salta si ./media/img ya tiene contenido (por ejemplo, en un redeploy).
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Descargando media de ejercicios (~140 MB, una sola vez)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Media lista ($$(ls /out/img | wc -l) imágenes)."
        else
          echo "✓ Media de ejercicios ya presente — se omite la descarga."
        fi
    restart: "no"

  # Backend: passkeys (WebAuthn) + datos por usuario.
  api:
    build: ./api
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - RP_ID=${RP_ID}
      - ORIGIN=${ORIGIN}
      - RP_NAME=${RP_NAME:-openGym}
      - ADMIN_UIDS=${ADMIN_UIDS:-}
      - INVITE_ONLY=${INVITE_ONLY:-0}
    volumes:
      # db.json, passkeys, secretos de sesión, vapid.json — hacer backup de esto.
      - opengym_data:/data

  # Frontend (build multi-stage) + nginx como proxy reverso hacia /api.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro

volumes:
  opengym_data:
    name: opengym_data_volume
